data:
  raw_glob: "data/raw/btc/*.parquet"
  processed_events: "data/processed/events.parquet"
  metadata: "data/metadata/data_summary.json"
  calibration_days: ["2026-07-05", "2026-07-06", "2026-07-07", "2026-07-08", "2026-07-09", "2026-07-10", "2026-07-11", "2026-07-12", "2026-07-13", "2026-07-15"]
