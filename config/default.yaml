  trials: 80
  seeds_per_trial: 3
  weights:
    median_spread: 2.0
    mean_trade_size: 1.0
    trades_per_second: 2.0
    sign_acf_1: 2.0
    response_1: 2.0
    response_10: 2.0
    return_volatility: 1.5
    spread_distribution: 2.0
    relative_spread_distribution: 1.0
    trade_size_distribution: 1.5
    interarrival_distribution: 1.5
    depth_distribution: 1.0
    sign_acf_curve: 2.0
